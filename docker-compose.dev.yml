# docker-compose.dev.yml — W-F7 dev 用 host port forward(per specs/011-port-mapping/)
# 用法:docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --wait
# 不寫進主 docker-compose.yml(避免 prod 誤暴露);僅 dev / debug 場景使用
# 4 個 port 全綁 127.0.0.1(loopback only、不暴露 LAN)
# 11443 HTTPS 留 W-F6 TLS feature;0.0.0.0 LAN binding 不支援
#
# 044 新增:include docker-compose.observability.yml
# observability.yml 本身 7 obs service 無 profiles:(預設 always-on),
# 故 dev 直接 include 即得 dev-default-on 7 service(per spec Q3 clarification);
# prod 反過來在 prod.yml 對每 obs service 加 profiles: ["observability"] gating。
# 新暴露 host port:grafana 13000 / prometheus 13090(127.0.0.1 loopback)

include:
  - docker-compose.observability.yml

services:
  front-nginx:
    ports:
      - "127.0.0.1:11080:80"          # SPA + /api/ 反向代理對外入口
      - "127.0.0.1:11443:443"         # ★ W-F6 新增 HTTPS
    volumes:                           # ★ W-F6 新增整段
      - ./deploy/dev-certs:/etc/nginx/certs:ro

  rust-api:
    ports:
      - "127.0.0.1:11081:11081"       # rust-api 直連(跳過 nginx debug)

  postgres:
    ports:
      - "127.0.0.1:15432:5432"        # psql / DBeaver 直連

  redis:
    ports:
      - "127.0.0.1:16379:6379"        # redis-cli / RedisInsight 直連

  # ---------------------------------------------------------------------------
  # 044: dev-default-on obs host port forward(Q3 clarification)
  # prometheus / grafana UI 暴露到 host(127.0.0.1 loopback)、其他 5 obs service
  # 只在 obs 內部網路 — Phase 3-5 配置內部 scrape / dashboard 連線
  # ---------------------------------------------------------------------------
  prometheus:
    ports:
      - "127.0.0.1:13090:9090"        # prometheus UI + /metrics
  grafana:
    ports:
      - "127.0.0.1:13000:3000"        # grafana UI
