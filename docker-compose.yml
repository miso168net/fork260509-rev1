# =============================================================================
# rev1 deploy docker-compose 主檔(W-F4)
#
# 8 service stack:postgres + redis + migration(one-shot)+ rust-api + base-web + front-nginx + acme(prod profile)+ cleanup(jobs profile)
# 1 bridge network:internal
# 2 named volumes:postgres_data + redis_data
# 5 secrets(W-F4):jwt_secret / database_url / redis_url / postgres_password / redis_password
#
# W-F4 改動範圍(per specs/009-secret-injection/):
# - 加 top-level secrets: 段(5 entries)
# - 4 service 加 secrets: ref(postgres / redis / migration / rust-api;base-web 不加)
# - rust-api environment 換 *_FILE 變量
# - postgres environment 換 POSTGRES_PASSWORD_FILE
# - redis command 改 shell expand 從 secret file 讀
# - migration entrypoint 包 wrapper shell 從 secret file 讀 DATABASE_URL
# - 不動 networks / volumes / depends_on / healthcheck 結構
#
# 不在 W-F4 範疇(後續 feature):
# - front-nginx 反向代理 → W-F5
# - TLS / acme → W-F6
# - 對外 host port forwarding → W-F7(W-F4 嚴守邊界、不開任何 host port)
# - observability stack → W-F12-14
# - backup / DR → W-F15-16
# - CI/CD pipeline → W-F17-18
# - cleanup-job / outbox-worker → W-F9-10
#
# F14 改動範圍(per specs/029-design-a-to-b-cutover/):
# - 移除 nestjs service block(DESIGN-B cutover、track-a profile 退場)
# - 保留 refresh_token_secret(rust-api 仍使用)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # postgres(per W-F4 spec FR-007 / contracts C-S5)
  # 用 POSTGRES_PASSWORD_FILE(image-native);POSTGRES_USER / POSTGRES_DB 維持直接 env(非 secret)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17.4
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # redis(per W-F4 spec FR-008 / contracts C-S7)
  # shell form + $$(cat /run/secrets/redis_password) 從 secret file 讀
  # (per W-F3 R-006 sticky;$$ 為 compose escape per analyze I2)
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack:7.4.0-v3
    command: ["sh", "-c", "redis-server --requirepass \"$$(cat /run/secrets/redis_password)\""]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # migration(per W-F4 spec FR-006 / contracts C-S6 / clarify Q1)
  # entrypoint wrapper:從 secret file 讀 DATABASE_URL → export env → exec 真正 migration
  # 注意:
  # - 用 DATABASE_URL(sea-orm-cli 標準、非 APP_DATABASE_URL — migration 是 sea-orm-cli 二進制、
  #   不走 rust-api 的 EnvConfigLoader)
  # - $$ 為 compose escape(per analyze I2);docker compose config 渲染後 shell 看到 $()
  # - exec 確保 migration process 取代 wrapper、signal handling 正確(per R-007)
  # - 必移除 W-F3 既有 command: ["up"](避免被當 sh 額外 arg);"up" 移入 entrypoint 字串
  # ---------------------------------------------------------------------------
  migration:
    image: rust-api:${IMAGE_TAG:-rev1-admin-rust-api}
    entrypoint: ["sh", "-c", "DATABASE_URL=\"$$(cat /run/secrets/database_url)\" exec /usr/local/bin/migration up"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  # ---------------------------------------------------------------------------
  # rust-api(per W-F4 spec FR-005 / contracts C-S4 / C-S5)
  # 3 個 _FILE env 取代 W-F3 既有 APP_* 直接 env
  # F1.1 + W-F4 hardening helper 在 config_init.rs callsite 讀 secret file
  # ---------------------------------------------------------------------------
  rust-api:
    image: rust-api:${IMAGE_TAG:-rev1-admin-rust-api}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_JWT_JWT_SECRET_FILE: /run/secrets/jwt_secret
      APP_JWT_REFRESH_SECRET_FILE: /run/secrets/refresh_token_secret
      APP_DATABASE_URL_FILE: /run/secrets/database_url
      APP_REDIS_URL_FILE: /run/secrets/redis_url
    secrets:
      - jwt_secret
      - refresh_token_secret
      - database_url
      - redis_url
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # base-web(W-F2 既有 image、W-F3 配置;W-F4 不引用任何 secret)
  # 無 depends_on — base-web 為 static SPA、無 runtime backend dep
  # ---------------------------------------------------------------------------
  base-web:
    image: base-web:${BASE_WEB_TAG:-rev1-admin-base-web}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # front-nginx(W-F5 反向代理 + SPA gateway)
  # per specs/010-front-nginx/、DESIGN-W §4.2
  # - 2 upstream(base_web:8080 / rust_api:11081 + keepalive 32)
  # - 3 location(= /health self / /api/ → rust_api/ 切前綴 / / → base_web SPA)
  # - 5 header forwarding(/api/ 內)
  # - 無 ports(留 W-F7)、無 TLS(留 W-F6)、無 secrets(純路由配置)
  # ---------------------------------------------------------------------------
  front-nginx:
    image: nginx:1.27-alpine
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./deploy/front-nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/front-nginx/snippets:/etc/nginx/snippets:ro   # ★ W-F6 新增
      - front_nginx_certs:/etc/nginx/certs:ro                  # ★ W-F6 新增
    depends_on:
      base-web:
        condition: service_healthy
      rust-api:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # acme(W-F6 prod TLS cert management via acme.sh + Let's Encrypt)
  # profiles: ["prod"] — dev 啟動不包含此 service
  # front_nginx_certs volume 共用：acme 寫入、front-nginx 唯讀掛載
  # ---------------------------------------------------------------------------
  acme:
    image: neilpang/acme.sh:latest
    profiles: ["prod"]
    command: ["daemon"]
    volumes:
      - front_nginx_certs:/acme.sh
    environment:
      - ACME_EMAIL_FILE=/run/secrets/acme_email
    secrets:
      - acme_email
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # cleanup(F12 一次性清理 job)
  # profiles: ["jobs"] — 不隨 docker compose up 自動啟動；由 host cron 觸發：
  #   docker compose run --rm cleanup --execute
  # - 重用 rust-api image(第 3 個 binary /usr/local/bin/cleanup)
  # - entrypoint wrapper 從 cleanup_database_url secret 注入 DATABASE_URL
  # - "$$@" passthrough 讓 docker compose run --rm cleanup --execute 等 arg 流入 cleanup binary
  # - depends_on postgres healthy(不需 migration/redis/rust-api)
  # ---------------------------------------------------------------------------
  cleanup:
    image: rust-api:${IMAGE_TAG:-rev1-admin-rust-api}
    profiles: ["jobs"]
    entrypoint: ["sh", "-c", "DATABASE_URL=\"$$(cat /run/secrets/cleanup_database_url)\" exec /usr/local/bin/cleanup \"$$@\"", "sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CLEANUP_RETENTION_DAYS: ${CLEANUP_RETENTION_DAYS:-90}
    secrets:
      - cleanup_database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

# =============================================================================
# Secrets(per W-F4 spec FR-004 / contracts C-S3)
# 8 entries:jwt_secret / database_url / redis_url / postgres_password / redis_password / acme_email / refresh_token_secret(rust-api 用)/ cleanup_database_url
# operator 須先 cp .txt.example 為 .txt + 編輯填值,否則 compose config 渲染抓 file not found
# =============================================================================
secrets:
  jwt_secret:
    file: ./deploy/secrets/jwt_secret.txt
  database_url:
    file: ./deploy/secrets/database_url.txt
  redis_url:
    file: ./deploy/secrets/redis_url.txt
  postgres_password:
    file: ./deploy/secrets/postgres_password.txt
  redis_password:
    file: ./deploy/secrets/redis_password.txt
  acme_email:
    file: ./deploy/secrets/acme_email.txt
  refresh_token_secret:
    file: ./deploy/secrets/refresh_token_secret.txt
  cleanup_database_url:
    file: ./deploy/secrets/cleanup_database_url.txt

# =============================================================================
# Networks(W-F3 維持)
# =============================================================================
networks:
  internal:
    driver: bridge

# =============================================================================
# Volumes(W-F3 維持;其他 6 volume 留 W-F12-16)
# =============================================================================
volumes:
  postgres_data:
  redis_data:
  front_nginx_certs:    # ★ W-F6 新增(acme.sh 寫入 prod cert + front-nginx 唯讀掛載)
