apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      timeout: 60
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: '"request_id":"([^"]+)"'
          name: request_id
          url: '/explore?left={"datasource":"loki","queries":[{"refId":"A","expr":"{request_id=\"$${__value.raw}\"}"}]}'
