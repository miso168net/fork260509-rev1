# =============================================================================
# rev1 front-nginx 反向代理(W-F5)
#
# 兩 upstream + 三 location:
#   - `= /health`   exact   → front-nginx 自身返 200 ok(per /speckit-clarify Q1 Option A)
#   - `/api/`       prefix  → rust-api(trailing `/` 切前綴;`/api/auth/login` → rust-api `/auth/login`)
#   - `/`           prefix  → base-web SPA + static(base-web 內部 nginx 處理 try_files)
#
# 不在範疇:TLS(W-F6)/ host port(W-F7)/ nestjs upstream + TRANSITIONAL(W-FA1)/
#         rate limiting(follow-up)/ nginx access log JSON(W-F12 obs stack)
# =============================================================================

upstream base_web {
    server base-web:8080;
}

upstream rust_api {
    server rust-api:11081;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # front-nginx 自身 healthcheck;exact match 優於 prefix `/`、不會被 SPA / 攔截
    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # /api/ → rust-api(trailing `/` 切前綴;header 抽共用 snippets per W-F6 T029)
    location /api/ {
        proxy_pass http://rust_api/;
        include /etc/nginx/snippets/proxy_headers.inc;
    }

    # / → base-web SPA(無 trailing slash 保留完整 path、base-web 內部 nginx try_files 接 SPA fallback)
    location / {
        proxy_pass http://base_web;
        proxy_set_header Host $host;
    }
}

# =============================================================================
# HTTPS server block(W-F6)
# =============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://rust_api/;
        include /etc/nginx/snippets/proxy_headers.inc;
    }

    location / {
        proxy_pass http://base_web;
        proxy_set_header Host $host;
    }
}
