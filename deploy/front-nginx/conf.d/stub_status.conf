# 044 W-F13 (FR-007): internal-only stub_status endpoint for nginx-exporter scrape
# Listens on container port 8081 (not exposed to host); access restricted to docker internal network CIDR.
# Returns nginx's basic in-built status page:
#   Active connections: N
#   server accepts handled requests
#    M N P
#   Reading: A Writing: B Waiting: C

server {
    listen 8081;
    server_name _;

    # docker compose internal network CIDR (172.16.0.0/12 covers default bridge ranges)
    # plus container localhost for self-curl smoke testing
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
    }

    # nothing else exposed on this port
    location / {
        return 404;
    }
}
